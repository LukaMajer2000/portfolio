<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starejši projekti</title>
    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <main class="section-container" style="margin-top: 2rem;">

        <a href="index.html#projects" class="contact-item"
            style="display: inline-flex; width: fit-content; margin-bottom: 2rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span>Nazaj</span>
        </a>

        <header style="margin-bottom: 2rem;">
            <h1 style="color: #f8fafc; font-size: 2.25rem; margin-bottom: 0.5rem;">Stari projekti</h1>
            <p style="color: #94a3b8;">Razni projekti iz preteklosti</p>

            <div class="tag-cloud" style="margin-top: 1rem;">
                <span>Blender</span>
                <span>3D-modeliranje</span>
            </div>
        </header>


        <section>
            <h2 style="color: #f8fafc; margin-bottom: 1.5rem;">Galerija</h2>

            <div class="skills-grid">
                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/1.png" alt="Low-poly cerkev"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Low-poly cerkev</p>
                </div>

                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/2.png" alt="Low-poly ječa"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Low-poly ječa</p>
                </div>

                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/3.png" alt="Low-poly učni prostor"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Low-poly učni prostor</p>
                </div>

                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/4.png" alt="Stanovanje"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Stanovanje</p>
                </div>

                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/5.png" alt="Low-poly mesto 1"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Low-poly mesto 1</p>
                </div>

                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/6.png" alt="Low-poly mesto 2"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Low-poly mesto 2</p>
                </div>

                <div class="skill-category" style="padding: 0; overflow: hidden;">
                    <img src="assets/images/projects/stariProjekti/7.png" alt="Miza"
                        onclick="openModal(this)"
                        style="width: 100%; height: 220px; object-fit: cover; display: block;">
                    <p style="padding: 1rem; color: #94a3b8; font-size: 0.875rem; margin: 0;">Miza</p>
                </div>

            </div>
        </section>
    </main>

    <div id="image-modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img id="modal-img" src="" alt="Povečana slika">
    </div>
    
    <script src="assets/js/main.js"></script>

    <footer class="site-footer">
        <p>&copy; 2026 Luka Majer. Vse pravice pridržane.</p>
    </footer>

</body>

</html>
